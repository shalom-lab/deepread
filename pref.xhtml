<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	id="deepread-pref-fragment">
	<linkset>
		<html:link rel="localization" href="deepread.ftl" />
	</linkset>

	<groupbox>
		<caption label="DeepRead - API 账号" />
		<label value="对话底部可切换服务商与模型。在下方填写 API Key 和模型 ID，每行一个模型。"
			style="color:#666; font-size:11px; margin-bottom:4px;" />
	</groupbox>

	<!-- ===== Gemini ===== -->
	<groupbox>
		<caption label="① Gemini（仅本段设置）" />
		<label value="支持直接投喂 PDF。模型在对话底部选择。"
			style="color:#888; font-size:11px; margin-bottom:4px;" />

		<label value="Gemini API Key：" />
		<html:input id="deepread-gemini-apiKey-input" type="password"
			preference="extensions.deepread.gemini.apiKey" style="width: 100%;" />

		<html:label for="deepread-gemini-models">可选模型（每行一个 ID）：</html:label>
		<html:textarea id="deepread-gemini-models" rows="4" spellcheck="false"
			placeholder="gemini-3.1-flash-lite-preview&#10;gemini-2.5-flash-lite&#10;gemini-3-flash-preview&#10;gemini-2.5-flash" preference="extensions.deepread.gemini.models" style="width:100%; box-sizing:border-box;"
			onchange="Zotero.DeepRead.updateModelList('gemini', this)" />

		<label value="Temperature（仅 Gemini）：" />
		<html:input id="deepread-gemini-temperature-input" type="number" min="0" max="1" step="0.1"
			preference="extensions.deepread.gemini.temperature" style="width: 100%;" />
	</groupbox>

	<!-- ===== OpenAI ===== -->
	<groupbox>
		<caption label="② OpenAI（仅本段设置）" />
		<label value="Base URL 可填官方或中转。模型在对话底部选择。"
			style="color:#888; font-size:11px; margin-bottom:4px;" />

		<label value="OpenAI API Key：" />
		<html:input id="deepread-openai-apiKey-input" type="password"
			preference="extensions.deepread.openai.apiKey" style="width: 100%;" />

		<html:label for="deepread-openai-models">可选模型（每行一个 ID）：</html:label>
		<html:textarea id="deepread-openai-models" rows="3" spellcheck="false"
			placeholder="gpt-6.1-sol&#10;gpt-6.1-terra&#10;gpt-6-luna" preference="extensions.deepread.openai.models" style="width:100%; box-sizing:border-box;"
			onchange="Zotero.DeepRead.updateModelList('openai', this)" />

		<label value="OpenAI Base URL：" />
		<html:input id="deepread-openai-baseUrl-input" type="text"
			preference="extensions.deepread.openai.baseUrl" style="width: 100%;"
			placeholder="https://api.openai.com/v1" />
	</groupbox>

	<!-- ===== DeepSeek ===== -->
	<groupbox>
		<caption label="③ DeepSeek（仅本段设置）" />
		<label value="阅读 PDF 需要支持文件输入的模型。"
			style="color:#888; font-size:11px; margin-bottom:4px;" />

		<label value="DeepSeek API Key：" />
		<html:input id="deepread-deepseek-apiKey-input" type="password"
			preference="extensions.deepread.deepseek.apiKey" style="width: 100%;" />

		<html:label for="deepread-deepseek-models">可选模型（每行一个 ID）：</html:label>
		<html:textarea id="deepread-deepseek-models" rows="2" spellcheck="false"
			placeholder="deepseek-flash" preference="extensions.deepread.deepseek.models" style="width:100%; box-sizing:border-box;"
			onchange="Zotero.DeepRead.updateModelList('deepseek', this)" />

		<label value="DeepSeek Base URL：" />
		<html:input id="deepread-deepseek-baseUrl-input" type="text"
			preference="extensions.deepread.deepseek.baseUrl" style="width: 100%;"
			placeholder="https://api.deepseek.com" />

		<label value="PDF 解析模式：" />
		<menulist id="deepread-deepseek-parse-input" style="width: 100%;"
			preference="extensions.deepread.deepseek.parsePurpose">
			<menupopup>
				<menuitem label="rich_layout_recognition (文字+图表)" value="rich_layout_recognition" />
				<menuitem label="text_recognition (仅文字)" value="text_recognition" />
			</menupopup>
		</menulist>
	</groupbox>

	<groupbox>
		<checkbox id="deepread-sidebar-enabled" native="true"
			label="显示常驻侧栏（可拖动、可折叠；多选也可用）"
			preference="extensions.deepread.sidebar.enabled"
			oncommand="try{Zotero.DeepRead.Sidebar.syncAll()}catch(e){}"/>
		<label value="勾选后主窗口右上角出现 DeepRead 浮层。可拖标题栏，点 – 折叠。"
			style="color:#888; font-size:11px; margin-top:4px;" />
	</groupbox>

	<vbox style="margin-top: 15px; gap: 8px;">
		<label data-l10n-id="deepread-pref-quota"
			style="color: #2980b9; cursor: pointer; text-decoration: underline; font-size: 11px; font-weight: 500;"
			onclick="Zotero.launchURL('https://aistudio.google.com/rate-limit')" />

		<label data-l10n-id="deepread-pref-openai-usage"
			style="color: #2980b9; cursor: pointer; text-decoration: underline; font-size: 11px; font-weight: 500;"
			onclick="Zotero.launchURL('https://platform.openai.com/usage')" />

		<label data-l10n-id="deepread-pref-deepseek-usage"
			style="color: #2980b9; cursor: pointer; text-decoration: underline; font-size: 11px; font-weight: 500;"
			onclick="Zotero.launchURL('https://platform.deepseek.com/usage')" />

		<label data-l10n-id="deepread-pref-star"
			style="color: #c0392b; cursor: pointer; text-decoration: underline; font-size: 11px; font-weight: 500;"
			onclick="Zotero.launchURL('https://github.com/shalom-lab/deepread')" />
	</vbox>
</vbox>
