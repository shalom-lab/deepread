<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
	xmlns:html="http://www.w3.org/1999/xhtml"
	id="deepread-pref-fragment">
	<linkset>
		<html:link rel="localization" href="deepread.ftl" />
	</linkset>

	<groupbox>
		<caption label="DeepRead - AI 配置" />

		<label value="当前服务商决定对话实际调用哪一家；下方三家 Key 可同时保存，互不影响。"
			style="color:#666; font-size:11px; margin-bottom:6px;" />

		<label value="当前服务商：" />
		<menulist id="deepread-provider-input" style="width: 100%;" preference="extensions.deepread.provider">
			<menupopup>
				<menuitem label="Gemini" value="gemini" />
				<menuitem label="OpenAI" value="openai" />
				<menuitem label="DeepSeek" value="deepseek" />
			</menupopup>
		</menulist>

		<label value="Temperature：" />
		<html:input id="deepread-temperature-input" type="number" min="0" max="1" step="0.1"
			preference="extensions.deepread.temperature" style="width: 100%;" />

		<label value="Max Tokens：" />
		<html:input id="deepread-maxTokens-input" type="number" min="1" max="8192"
			preference="extensions.deepread.maxTokens" style="width: 100%;" />
	</groupbox>

	<!-- ===== Gemini ===== -->
	<groupbox>
		<caption label="① Gemini（仅下方 Key / 模型生效于此）" />
		<label value="支持直接投喂 PDF；API Key 只给 Gemini 用。"
			style="color:#888; font-size:11px; margin-bottom:4px;" />

		<label value="Gemini API Key：" />
		<html:input id="deepread-gemini-apiKey-input" type="password"
			preference="extensions.deepread.gemini.apiKey" style="width: 100%;" />

		<label value="Gemini 模型：" />
		<menulist id="deepread-gemini-model-input" style="width: 100%;"
			preference="extensions.deepread.gemini.model">
			<menupopup>
				<menuitem label="gemini-3.1-flash-lite (主力)" value="gemini-3.1-flash-lite-preview" />
				<menuitem label="gemini-2.5-flash-lite" value="gemini-2.5-flash-lite" />
				<menuitem label="gemini-3-flash" value="gemini-3-flash-preview" />
				<menuitem label="gemini-2.5-flash" value="gemini-2.5-flash" />
			</menupopup>
		</menulist>
	</groupbox>

	<!-- ===== OpenAI ===== -->
	<groupbox>
		<caption label="② OpenAI（仅下方 Key / URL / 模型生效于此）" />
		<label value="Base URL 可填官方或中转；与 Gemini / DeepSeek 互不影响。"
			style="color:#888; font-size:11px; margin-bottom:4px;" />

		<label value="OpenAI API Key：" />
		<html:input id="deepread-openai-apiKey-input" type="password"
			preference="extensions.deepread.openai.apiKey" style="width: 100%;" />

		<label value="OpenAI Base URL：" />
		<html:input id="deepread-openai-baseUrl-input" type="text"
			preference="extensions.deepread.openai.baseUrl" style="width: 100%;"
			placeholder="https://api.openai.com/v1" />

		<label value="OpenAI 模型：" />
		<html:input id="deepread-openai-model-input" type="text"
			preference="extensions.deepread.openai.model" style="width: 100%;"
			placeholder="gpt-6.1-sol" />
	</groupbox>

	<!-- ===== DeepSeek ===== -->
	<groupbox>
		<caption label="③ DeepSeek（仅下方 Key / URL / 模型生效于此）" />
		<label value="API 模型名填 deepseek-flash（即产品名 V4.1-Flash）。"
			style="color:#888; font-size:11px; margin-bottom:4px;" />

		<label value="DeepSeek API Key：" />
		<html:input id="deepread-deepseek-apiKey-input" type="password"
			preference="extensions.deepread.deepseek.apiKey" style="width: 100%;" />

		<label value="DeepSeek Base URL：" />
		<html:input id="deepread-deepseek-baseUrl-input" type="text"
			preference="extensions.deepread.deepseek.baseUrl" style="width: 100%;"
			placeholder="https://api.deepseek.com" />

		<label value="DeepSeek 模型：" />
		<html:input id="deepread-deepseek-model-input" type="text"
			preference="extensions.deepread.deepseek.model" style="width: 100%;"
			placeholder="deepseek-flash" />

		<label value="PDF 解析模式：" />
		<menulist id="deepread-deepseek-parse-input" style="width: 100%;"
			preference="extensions.deepread.deepseek.parsePurpose">
			<menupopup>
				<menuitem label="rich_layout_recognition (文字+图表)" value="rich_layout_recognition" />
				<menuitem label="text_recognition (仅文字)" value="text_recognition" />
			</menupopup>
		</menulist>
	</groupbox>

	<vbox style="margin-top: 15px; gap: 8px;">
		<label value="📊 查询 Gemini API 额度 (Google AI Studio)"
			style="color: #2980b9; cursor: pointer; text-decoration: underline; font-size: 11px; font-weight: 500;"
			onclick="Zotero.launchURL('https://aistudio.google.com/rate-limit')" />

		<label value="如果觉得有用，给我一个 Star，你的鼓励是我最大的动力！"
			style="color: #c0392b; cursor: pointer; text-decoration: underline; font-size: 11px; font-weight: 500;"
			onclick="Zotero.launchURL('https://github.com/shalom-lab/deepread')" />
	</vbox>
</vbox>
