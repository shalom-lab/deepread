name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Version
        # This strips the "v" from the tag, e.g., "v1.0.1" -> "1.0.1"
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Update Versions
        # Uses jq to reliably update version strings in manifest.json and package.json
        run: |
          jq '.version = "${{ env.VERSION }}"' manifest.json > tmp.json && mv tmp.json manifest.json
          jq '.version = "${{ env.VERSION }}"' package.json > tmp.json && mv tmp.json package.json

      - name: Install Dependencies
        run: npm install

      - name: Build Plugin (XPI)
        run: npm run build

      - name: Generate updates.json
        run: |
          HASH="sha256:$(sha256sum "deepread-v${VERSION}.xpi" | awk '{print $1}')"
          jq -n \
            --arg version "$VERSION" \
            --arg link "https://github.com/shalom-lab/deepread/releases/download/v${VERSION}/deepread-v${VERSION}.xpi" \
            --arg hash "$HASH" \
            '{
              addons: {
                "deepread@zotero.org": {
                  updates: [
                    {
                      version: $version,
                      update_link: $link,
                      update_hash: $hash,
                      applications: {
                        zotero: {
                          strict_min_version: "7.0"
                        }
                      }
                    }
                  ]
                }
              }
            }' > updates.json
          echo "Generated updates.json:"
          cat updates.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          files: |
            deepread-v${{ env.VERSION }}.xpi
            updates.json
          generate_release_notes: true
